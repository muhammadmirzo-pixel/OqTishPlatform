# Included in the server block AND in every location that sets its own add_header, because nginx
# drops inherited add_header directives as soon as a location defines one.
#
# CSP notes (docs/FRONTEND.md "Xavfsizlik sarlavhalari"):
# - script-src https://telegram.org: the Telegram Login Widget (/login) and the Mini App SDK (/tg)
#   are injected on demand. The SPA navigates client-side, so the policy of the first loaded
#   document applies to every route; that is why the website policy allows them as well.
# - frame-src https://oauth.telegram.org: the Login Widget renders its button in that iframe.
# - No 'unsafe-inline' / 'unsafe-eval': the widget's data-onauth mode (eval) is not used.
# - img-src 'self' covers uploaded logos/avatars (GET /api/files/images/{id}, same origin); blob: allows the
#   local preview of a picked file before upload (URL.createObjectURL).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self' https://telegram.org; connect-src 'self'; frame-src https://oauth.telegram.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
