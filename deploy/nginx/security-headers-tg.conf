# Headers for the Telegram Mini App document (/tg, /tg/*). Identical to security-headers.conf except
# that Telegram's web clients (web.telegram.org, k/a versions) may frame the page: frame-ancestors
# lists them and X-Frame-Options is omitted (it cannot express an allow-list). Native Telegram apps
# use a WebView and are not affected by framing rules.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://telegram.org; connect-src 'self'; frame-src https://oauth.telegram.org; frame-ancestors https://web.telegram.org https://*.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'" always;
