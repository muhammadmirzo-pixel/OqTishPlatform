# Use a PostgreSQL running on THIS machine instead of the bundled postgres container:
#   docker compose -f compose.yaml -f compose.hostdb.yaml up -d --build --wait
#
# The connection comes from OQTISH_HOSTDB_CONNECTION in .env (never written here).
# Host PostgreSQL usually listens on 127.0.0.1 only, so the services join the host network;
# everything still binds to 127.0.0.1 (API :5080, web :8080). Local development only.
services:
  postgres:
    profiles: ["bundled-db"]          # not started in this mode

  migrate:
    network_mode: host
    networks: !reset []
    depends_on: !reset {}
    environment:
      OQTISH_MIGRATIONS_CONNECTION: ${OQTISH_HOSTDB_CONNECTION:?set in .env}

  api:
    network_mode: host
    networks: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
      ConnectionStrings__Main: ${OQTISH_HOSTDB_CONNECTION:?set in .env}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]

  worker:
    network_mode: host
    networks: !reset []
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Main: ${OQTISH_HOSTDB_CONNECTION:?set in .env}

  web:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      OQTISH_API_UPSTREAM: 127.0.0.1:5080
      OQTISH_WEB_LISTEN: 127.0.0.1:8080
